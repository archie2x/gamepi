assets_directory = "/usr/share/libretro/assets"
libretro_info_path = "/usr/share/libretro/info"
libretro_directory = "~/.local/share/gamepi/retroarch/cores"
joypad_autoconfig_dir = "~/.config/gamepi/retroarch/autoconfig"
input_remapping_directory = "~/.config/gamepi/retroarch/remaps"
rgui_config_directory = "~/.config/gamepi/retroarch/overrides"
core_options_path = "~/.config/gamepi/retroarch/core-options.cfg"
savefile_directory = "~/.local/share/gamepi/retroarch/saves"
savestate_directory = "~/.local/share/gamepi/retroarch/states"
system_directory = "~/.local/share/gamepi/retroarch/system"
screenshot_directory = "~/.local/share/gamepi/retroarch/screenshots"
playlist_directory = "~/.local/share/gamepi/retroarch/playlists"
cache_directory = "~/.cache/gamepi/retroarch"
rgui_browser_directory = "/srv/ROMs"

video_driver = "vulkan"
video_context_driver = "vk_x"
video_fullscreen = "true"
video_vsync = "true"
menu_driver = "ozone"
audio_driver = "alsa"
audio_sync = "true"
input_driver = "x"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
input_sensors_enable = "true"
input_menu_toggle = "f1"
input_exit_emulator = "escape"
config_save_on_exit = "true"
menu_show_online_updater = "true"
menu_show_core_updater = "true"
core_updater_buildbot_url = "https://buildbot.libretro.com/nightly/linux/aarch64/latest/"
